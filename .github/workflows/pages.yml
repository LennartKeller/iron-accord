name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deployment needs elevated permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Commander_Wars submodule holds the scripts and artwork that
          # tools/build-data.ts turns into data/. Without it there is no game.
          submodules: recursive

      # Turns Pages on if it has not been configured yet. Without this the
      # build succeeds, the artifact uploads, and the deploy then 404s because
      # the repository has no Pages site to deploy to.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test

      - name: Build game data from the submodule
        run: npm run build:data

      - name: Build site
        # A project site is served from /<repo>/, so the bundle and every asset
        # URL has to be built for that prefix.
        env:
          IRON_ACCORD_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium

      - name: Test the production site in desktop and mobile browsers
        env:
          IRON_ACCORD_BASE: /${{ github.event.repository.name }}/
        run: npm run test:browser

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
